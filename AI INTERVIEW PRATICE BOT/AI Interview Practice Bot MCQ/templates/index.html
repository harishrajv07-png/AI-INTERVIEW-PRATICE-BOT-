<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Interview Practice Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>AI Interview Practice Bot</h1>
      <p class="subtitle">
        Practice technical, aptitude, communication, and personal
        interview questions as multiple-choice. Get instant right/wrong
        feedback with an explanation, and a structured summary at the end
        of the session.
      </p>

      <form action="{{ url_for('start') }}" method="post">
        <label for="category">Category</label>
        <select name="category" id="category">
          <option value="">All categories (mixed)</option>
          {% for c in categories %}
            <option value="{{ c }}">{{ labels.get(c, c) }}</option>
          {% endfor %}
        </select>

        <label for="num_questions">Number of questions</label>
        <input type="number" name="num_questions" id="num_questions" value="5" min="3" max="10">

        <button type="submit">Start Practice Session</button>
      </form>
    </div>
  </div>
</body>
</html>
