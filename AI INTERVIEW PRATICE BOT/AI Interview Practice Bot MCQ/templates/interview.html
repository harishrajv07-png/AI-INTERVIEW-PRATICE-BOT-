<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question {{ index + 1 }} -- AI Interview Practice Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="progress">Question {{ index + 1 }} of {{ total }}</div>
      <div class="badge">{{ category_label }}</div>
      <div class="question-text">{{ question.text }}</div>

      <form action="{{ url_for('answer') }}" method="post">
        <div class="options">
          {% for opt in question.options %}
            <label class="option">
              <input type="radio" name="choice" value="{{ loop.index0 }}" required>
              <span>{{ opt }}</span>
            </label>
          {% endfor %}
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <button type="submit">Submit Answer</button>
      </form>
      <a class="footer-link" href="{{ url_for('restart') }}">Restart session</a>
    </div>
  </div>
</body>
</html>
